<style>
:root{
  --paper:#F1F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --raise:#FFFFFF;
  --ink:#121816; --ink-2:#4A5451; --ink-3:#68716E;
  --rule:#DBE1DE; --rule-2:#C1C8C5;
  --accent:#0D5C52; --accent-ink:#FFFFFF; --accent-soft:#DCEAE6;
  --todo-fg:#5D6965; --todo-bd:#BFC7C3;
  --work-bg:#B26B00; --work-fg:#FFFFFF;
  --done-bg:#3D6B4F; --done-fg:#FFFFFF;
  --stuck-bg:#B03830; --stuck-fg:#FFFFFF;
  --warn-bg:#FBF0DC; --warn-fg:#6B4405; --warn-bd:#E8CE9C;
  --err-bg:#FAE9E7;  --err-fg:#83261F;  --err-bd:#EBC0BB;
  --ok-bg:#E2EFE7;   --ok-fg:#29513A;   --ok-bd:#B9D4C4;
  --scrim:rgba(18,24,22,.42);
  --shadow:0 1px 2px rgba(18,24,22,.05), 0 12px 34px -12px rgba(18,24,22,.18);
  --sans:"IBM Plex Sans Hebrew","IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0E1312; --surface:#171C1A; --sunk:#121716; --raise:#1C2220;
  --ink:#E6ECE9; --ink-2:#98A39F; --ink-3:#8A9591;
  --rule:#272E2B; --rule-2:#38403C;
  --accent:#4FBFA9; --accent-ink:#05221E; --accent-soft:#142E29;
  --todo-fg:#98A39F; --todo-bd:#38403C;
  --work-bg:#C07713; --work-fg:#1A1200;
  --done-bg:#3A6F50; --done-fg:#EAF4EE;
  --stuck-bg:#BC463D; --stuck-fg:#FFF3F1;
  --warn-bg:#2E230F; --warn-fg:#E9C27C; --warn-bd:#4A3819;
  --err-bg:#2E1614;  --err-fg:#E9A79F;  --err-bd:#4A2320;
  --ok-bg:#14291D;   --ok-fg:#8FC5A4;   --ok-bd:#24422F;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -14px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --paper:#0E1312; --surface:#171C1A; --sunk:#121716; --raise:#1C2220;
  --ink:#E6ECE9; --ink-2:#98A39F; --ink-3:#8A9591;
  --rule:#272E2B; --rule-2:#38403C;
  --accent:#4FBFA9; --accent-ink:#05221E; --accent-soft:#142E29;
  --todo-fg:#98A39F; --todo-bd:#38403C;
  --work-bg:#C07713; --work-fg:#1A1200;
  --done-bg:#3A6F50; --done-fg:#EAF4EE;
  --stuck-bg:#BC463D; --stuck-fg:#FFF3F1;
  --warn-bg:#2E230F; --warn-fg:#E9C27C; --warn-bd:#4A3819;
  --err-bg:#2E1614;  --err-fg:#E9A79F;  --err-bd:#4A2320;
  --ok-bg:#14291D;   --ok-fg:#8FC5A4;   --ok-bd:#24422F;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -14px rgba(0,0,0,.6);
}
:root[data-theme="light"]{
  --paper:#F1F4F3; --surface:#FFFFFF; --sunk:#E8ECEA; --raise:#FFFFFF;
  --ink:#121816; --ink-2:#4A5451; --ink-3:#68716E;
  --rule:#DBE1DE; --rule-2:#C1C8C5;
  --accent:#0D5C52; --accent-ink:#FFFFFF; --accent-soft:#DCEAE6;
  --todo-fg:#5D6965; --todo-bd:#BFC7C3;
  --work-bg:#B26B00; --work-fg:#FFFFFF;
  --done-bg:#3D6B4F; --done-fg:#FFFFFF;
  --stuck-bg:#B03830; --stuck-fg:#FFFFFF;
  --warn-bg:#FBF0DC; --warn-fg:#6B4405; --warn-bd:#E8CE9C;
  --err-bg:#FAE9E7;  --err-fg:#83261F;  --err-bd:#EBC0BB;
  --ok-bg:#E2EFE7;   --ok-fg:#29513A;   --ok-bd:#B9D4C4;
  --scrim:rgba(18,24,22,.42);
  --shadow:0 1px 2px rgba(18,24,22,.05), 0 12px 34px -12px rgba(18,24,22,.18);
}

:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;
  line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;unicode-bidi:isolate}
[dir="rtl"] .num{font-family:var(--sans);letter-spacing:0}
.mono{font-family:var(--mono);font-size:12.5px;unicode-bidi:isolate}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:400}
[dir="rtl"] .lbl{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:12px}
.dim{color:var(--ink-2)} .dim3{color:var(--ink-3)} .nowrap{white-space:nowrap}

.shell{max-width:1240px;margin:0 auto;padding:0 20px 120px}

/* ---- app bar ---- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:20px 0 14px;flex-wrap:wrap}
.brandwrap{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-size:19px;font-weight:500;letter-spacing:-.02em}
.brand em{font-style:normal;color:var(--accent)}
.today{font-size:12.5px;color:var(--ink-3)}
.bar-acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink-3);padding:7px 10px;font-size:12px;
  font-weight:500;display:inline-flex;align-items:center;gap:5px;line-height:1}
.seg button+button{border-inline-start:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}

/* Destructive, so it does not borrow the accent colour the rest of the
   chrome uses. It stays quiet until hovered. */
.btn-reset{border:1px solid var(--rule);background:transparent;color:var(--ink-2);
  border-radius:8px;padding:7px 11px;font:inherit;font-size:12px;font-weight:500;
  cursor:pointer;white-space:nowrap;transition:color .12s,border-color .12s,background .12s}
.btn-reset:hover:not(:disabled){color:var(--stuck-fg);border-color:var(--stuck-fg);background:var(--stuck-bg)}
.btn-reset:disabled{opacity:.55;cursor:default}

/* Same quiet shape, but this one adds work rather than destroying it, so it
   leans on the accent instead of the warning colour. */
.btn-scan:hover:not(:disabled){color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.seg svg{width:14px;height:14px}

/* ---- tabs ---- */
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--rule);margin-bottom:20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 13px;
  font-size:13.5px;color:var(--ink-3);white-space:nowrap;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:500}
.tabs b{display:inline-block;margin-inline-start:6px;background:var(--sunk);color:var(--ink-2);
  border-radius:999px;padding:0 6px;font-size:11px;font-weight:500;line-height:17px;vertical-align:1px}
.tabs button.on b{background:var(--accent-soft);color:var(--accent)}

/* ---- buttons ---- */
.btn{border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);border-radius:8px;
  padding:8px 12px;font-size:13px;font-weight:500;line-height:1;display:inline-flex;align-items:center;
  gap:7px;white-space:nowrap;transition:background .12s,border-color .12s}
.btn:hover{background:var(--sunk)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-sm{font-size:12px;padding:6px 10px;border-radius:7px}
/* Every control, not a list of the types that happened to exist. Naming
   type=text and type=number left email and date on the user-agent default,
   which is white — invisible until a dark-mode screenshot of the people form. */
select,textarea,input:not([type=checkbox]):not([type=radio]){background:var(--surface);
  border:1px solid var(--rule-2);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink)}
input::placeholder{color:var(--ink-3)}

/* ---- head + surfaces ---- */
.head{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap;margin-bottom:5px}
.head h2{margin:0;font-size:18px;font-weight:500;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13.5px;margin:0 0 18px;max-width:74ch;line-height:1.6}
.panelwrap{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.toolbar{display:flex;align-items:center;gap:9px;padding:11px 14px;background:var(--sunk);
  border-bottom:1px solid var(--rule);flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px}
.pad{padding:15px 17px}

/* ---- table ---- */
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:start;padding:10px 14px;border-bottom:1px solid var(--rule);white-space:nowrap;
  font-family:var(--mono);font-size:10.5px;font-weight:400;letter-spacing:.11em;
  text-transform:uppercase;color:var(--ink-3)}
[dir="rtl"] table.t th{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:12px}
table.t td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:13.5px}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr.click{cursor:pointer;transition:background .12s}
table.t tbody tr.click:hover{background:var(--sunk)}

/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 11px;
  border-radius:999px;white-space:nowrap;line-height:1;background:var(--sunk);color:var(--ink-2)}
.p-todo{color:var(--todo-fg);border:1px dashed var(--todo-bd);background:transparent}
.p-work{background:var(--work-bg);color:var(--work-fg)}
.p-done{background:var(--done-bg);color:var(--done-fg)}
.p-stuck{background:var(--stuck-bg);color:var(--stuck-fg)}
.p-hi{background:var(--stuck-bg);color:var(--stuck-fg)}
.p-me{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.p-lo{color:var(--todo-fg);border:1px dashed var(--todo-bd);background:transparent}
.p-ok{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.p-rev{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.p-ac{background:var(--accent-soft);color:var(--accent)}
.notfound{color:var(--ink-3);font-style:italic}

.banner{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-radius:10px;
  font-size:13.5px;line-height:1.55;background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.empty{padding:48px 24px;text-align:center;color:var(--ink-3);font-size:13.5px}

.kv{display:grid;grid-template-columns:170px 1fr;gap:7px 16px;font-size:13.5px;margin:0}
.kv dt{color:var(--ink-3);font-size:12px;padding-top:2px}
.kv dd{margin:0}

.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.metric{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.metric .v{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.2}
.metric .l{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* ---- flow ---- */
.stage{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
/* A skipped stage is dimmed as a whole, which stacked with --ink-2 to land
   under 3:1 in dark mode. Promoting the body text one step keeps the stage
   reading as inactive while its sentence stays legible. */
.stage.skip{opacity:.55}
.stage.skip .dim{color:var(--ink)}
.stagehd{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:10px}
.stepn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;
  border-radius:50%;background:var(--sunk);color:var(--ink-3);font-size:11.5px;font-weight:500;flex:none;
  font-family:var(--mono)}
.stage.act .stepn{background:var(--accent);color:var(--accent-ink)}
.stagehd b{font-size:14px;font-weight:500}
.stagehd .wf{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  border:1px solid var(--rule-2);border-radius:4px;padding:1px 5px;margin-inline-start:auto}
.conn{height:14px;border-inline-start:2px solid var(--rule-2);margin-inline-start:26px}
.rulerow{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;padding:6px 0;
  border-bottom:1px solid var(--rule);font-size:13px}
.rulerow:last-of-type{border-bottom:0}
.rulerow .mk{font-family:var(--mono);font-size:11px;min-width:58px;flex:none;color:var(--ink-3)}
/* --done-bg is a fill, not a foreground: on the dark surface it measured
   2.97:1. --ok-fg is the token meant to be read, and it flips with the theme. */
.rulerow.win{color:var(--ok-fg)} .rulerow.win .mk{color:var(--ok-fg)}
.rulerow.trip{color:var(--warn-fg)} .rulerow.trip .mk{color:var(--warn-fg)}
.rulerow .why{margin-inline-start:auto;color:var(--ink-3);font-size:12.5px}

/* ---- mail ---- */
.mailbox{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.mailhd{padding:13px 16px;border-bottom:1px solid var(--rule);background:var(--sunk);font-size:13px}
.mailhd .row{display:flex;gap:10px;padding:2px 0}
.mailhd .row>span:first-child{color:var(--ink-2);width:64px;flex:none;font-size:12px;padding-top:1px}
.mailbody{padding:16px;white-space:pre-wrap;font-size:13.5px;line-height:1.7;
  font-family:var(--mono);unicode-bidi:plaintext}
[dir="rtl"] .mailbody{font-family:var(--sans)}

/* ---- sheet ---- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.scrim.on{display:block}
.sheet{position:fixed;inset-block:0;inset-inline-end:0;width:min(470px,100%);background:var(--raise);
  border-inline-start:1px solid var(--rule-2);z-index:41;display:none;flex-direction:column;
  box-shadow:var(--shadow);overflow-y:auto}
.sheet.on{display:flex}
.shead{position:sticky;top:0;background:var(--raise);border-bottom:1px solid var(--rule);
  padding:15px 18px;display:flex;align-items:flex-start;gap:12px;z-index:1}
.shead h3{margin:0;font-size:15px;font-weight:500;line-height:1.35}
.xbtn{margin-inline-start:auto;width:28px;height:28px;border:0;background:transparent;color:var(--ink-3);
  border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:20px;line-height:1}
.xbtn:hover{background:var(--sunk);color:var(--ink)}
.ssec{padding:15px 18px;border-bottom:1px solid var(--rule)}
.ssec h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink-3);font-weight:400;font-family:var(--mono)}
[dir="rtl"] .ssec h4{font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:12px}

@media (max-width:640px){
  .shell{padding:0 13px 90px}
  .kv{grid-template-columns:1fr;gap:1px 0}
  .kv dd{margin-bottom:9px}
  .brand{font-size:17px}
}
</style>
</head>
<body>

<div class="shell">
  <header class="bar">
    <div class="brandwrap">
      <div class="brand">Office<em>Hub</em></div>
      <div class="today" id="tagline"></div>
    </div>
    <div class="bar-acts">
      <div class="seg" role="group" id="langSeg">
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
        <button type="button" data-lang="he" aria-pressed="false">עב</button>
      </div>
      <div class="seg" role="group" id="themeSeg">
        <button type="button" data-theme="light" aria-pressed="false" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
        </button>
        <button type="button" data-theme="dark" aria-pressed="false" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/></svg>
        </button>
      </div>
      <span class="pill p-me" id="srcPill"></span>
      <button type="button" class="btn-reset btn-scan" id="scanBtn" hidden></button>
      <button type="button" class="btn-reset" id="resetBtn" hidden></button>
    </div>
  </header>

  <div class="tabs" id="tabs"></div>
  <main id="view">
    <div class="card pad">
      <b>Scripts have not run.</b>
      <div class="dim" style="margin-top:6px">The page loaded but no JavaScript executed.
      Open this file in a browser rather than an embedded viewer.</div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet" aria-label="Details"></aside>

<script>
/* A startup error looks exactly like an empty app, which cost real time once.
   Anything thrown before or during boot is written into the page instead. */
window.onerror = function (msg, src, line, col) {
  var v = document.getElementById("view");
  if (v) v.innerHTML = '<div class="card pad"><b>Startup error</b>'
    + '<div class="mono dim" style="margin-top:8px;white-space:pre-wrap">'
    + String(msg) + "\n" + String(src || "?") + ":" + line + ":" + col + "</div></div>";
  return false;
};
</script>
<script>
/* ---- config.js ---- */
/* Office Hub — connection settings.
 *
 * Both values below are meant to be public. The publishable key ships to
 * every browser that opens the page; Row Level Security is what protects the
 * data, not secrecy about the key.
 *
 * Never put the service_role key or the database password here. Those belong
 * in n8n, which runs on a server. If one ever appears in this file, rotate it
 * in the Supabase dashboard — it is on GitHub Pages the moment it is pushed.
 *
 * Leave SUPABASE_URL empty to force the demo dataset.
 */

window.OFFICE_HUB_CONFIG = {

  SUPABASE_URL: "https://dljqfccjqtrrhzjdzyhu.supabase.co",

  SUPABASE_PUBLISHABLE_KEY: "sb_publishable_O3XvaR9Nv_t4dwFycPXIyQ_uby6ctCK",

  /* WF-5 in n8n. The Reset button posts here; n8n does the deleting with its
     own service-role credential, so the browser never holds the power to
     erase anything by itself.

     Used when the page is served from autorder.github.io. An https page
     cannot call http, so this has to be the tunnel and not localhost.
     ngrok free URLs change on every restart - update the host when it does.

     Leave empty to hide the Reset button entirely. */
  N8N_RESET_WEBHOOK_URL: "https://playing-twig-evergreen.ngrok-free.dev/webhook/office-reset",

  /* Used instead when the page is opened on localhost, so resetting works
     with no tunnel running. */
  N8N_RESET_WEBHOOK_URL_LOCAL: "http://localhost:5678/webhook/office-reset",

  /* WF-6 in n8n. The Scan button posts here. WF-1 only reacts to files that
     arrive after it started polling, so anything already sitting in Office
     Inbox - or dropped while n8n was down - would never be picked up. This
     is the manual sweep: list the folder, process whatever is in it.

     Same host rule as above: tunnel for the published page, localhost for
     the local one. Leave empty to hide the Scan button entirely. */
  N8N_SCAN_WEBHOOK_URL: "https://playing-twig-evergreen.ngrok-free.dev/webhook/office-scan",

  N8N_SCAN_WEBHOOK_URL_LOCAL: "http://localhost:5678/webhook/office-scan",

  /* WF-7 in n8n. The rules editor posts here - create, update and delete.

     The browser does not write to routing_rules itself, and the reason is the
     key three lines above this one: it is public, so a page that could edit a
     routing rule would let anyone who opens the URL decide where invoices go.
     WF-7 holds the service credential, validates every field, and refuses to

var LANG = "en";

function t(k, vars){
  var s = (T[LANG] && T[LANG][k]) || T.en[k] || k;
  if (vars) for (var v in vars) s = s.split("{" + v + "}").join(vars[v]);
  return s;
}
function isRTL(){ return LANG === "he"; }

/* Resolve a possibly-bilingual field to the current language. */
function val(f){
  if (f && typeof f === "object") return f[LANG] || f.en || "";
  return f == null ? "" : f;
}
/* Sentinels the model emits are translated; real quoted text is not. */
function sent(v){
  if (v === "Not found") return t("notFound");
  if (v === "No action found") return t("noAction");
  return val(v);
}

    "Catch-all": "תפס־הכל"
  }

function dbt(v){ var s = val(v), m = DBT[LANG]; return (m && m[s]) || s; }

/* WF-4 builds review_reason from four fixed phrases joined with "; ". They are
 * translated here rather than stored twice, because the workflow has to write
 * something a Google Sheet reader can also understand. A phrase this list does
 * not recognise is passed through, which is what happens when the workflow's
 * wording changes before this does - visibly English, never blank. */
var REASONS = [
  [/^Model confidence is (\S+)$/,                                "rsConf"],
  [/^(\d+) fields returned Not found$/,                          "rsFields"],
  [/^Document type is (\S+)$/,                                   "rsType"],
  [/^Urgency is High but no deadline appears in the document$/,  "rsNoDeadline"]
];
function reviewReason(v){
  var s = val(v);
  if (!s) return "";
  if (LANG === "en") return esc(s);
  return esc(s.split("; ").map(function(part){
    for (var i = 0; i < REASONS.length; i++){
      var m = part.match(REASONS[i][0]);
      if (m) return t(REASONS[i][1], { a: m[1] ? t(m[1]) : "" });
    }
    return part;
  }).join("; "));
}

/* Everything reads through db.*. A Supabase implementation would expose the
 * same five methods and no screen would change. */

var D = window.OFFICE_HUB_DATA;

var mockDb = {
  kind: "mock",
  people:        function(){ return D.people.slice(); },
  routingRules:  function(){ return D.routing_rules.slice().sort(function(a,b){ return a.rank - b.rank; }); },
  documents:     function(){ return D.documents.slice().sort(function(a,b){ return a.received_at < b.received_at ? 1 : -1; }); },
  tasks:         function(){ return D.tasks.slice(); },
  notifications: function(){ return D.notifications.slice(); }
};

/* The live source reads the same five tables the n8n workflows write to.
 *
 * Every screen calls db.*() synchronously and expects an array back, so the
 * five tables are fetched once into `live` and served from there. Making the
 * screens async instead would have touched every render function to solve a
 * problem that only exists for a few hundred rows.
 *
 * Reads only. Nothing in this app writes: routing decisions belong to n8n,
 * and a browser that could rewrite routing_rules could redirect where money
 * goes. */

var live = { people:[], routing_rules:[], documents:[], tasks:[], notifications:[], departments:[] };

/* A department is a slot in the dept_name enum plus a row saying what it is
 * called and whether it is open. The enum value never changes and is never
 * shown; the name is what everyone reads, and what WF-4 puts in front of the
 * model. Renaming therefore rewrites history, which is right - a renamed
 * department is the same department, and only the code identifies it.
 *
 * Falls back to naming the code after itself, so a document filed under a
 * department that was later removed from the table still reads as something. */
function departments(){ return db.kind === "live" ? live.departments : []; }
function deptName(code){
  if (!code) return "";
  var rows = departments();
  /* Through t(), not raw. The six seeded names are English words the dictionary
   * already translates - reading the name straight out of the table showed
   * "Management" to a Hebrew reader who used to see "הנהלה". A name the user
   * typed is not a dictionary key, so it comes back unchanged, which is the
   * whole point: their word wins, the seeded ones stay translated. */
  for (var i = 0; i < rows.length; i++) if (rows[i].code === code) return t(rows[i].name);
  return t(code);
}
/* Only open departments are offered anywhere a choice is made. A closed one
 * still renders wherever it was already stored. */
function deptCodes(){
  var rows = departments().filter(function(d){ return d.is_active !== false; });
  return rows.length ? rows.map(function(d){ return d.code; }) : D.DEPARTMENTS;
}

var supabaseDb = {
  kind: "live",
  people:        function(){ return live.people.slice(); },
  routingRules:  function(){ return live.routing_rules.slice().sort(function(a,b){ return a.rank - b.rank; }); },
  documents:     function(){ return live.documents.slice().sort(function(a,b){ return a.received_at < b.received_at ? 1 : -1; }); },
  tasks:         function(){ return live.tasks.slice(); },
  notifications: function(){ return live.notifications.slice(); }
};

var db = mockDb;

/* --------------------------------------------------- reset and scan ---- */
/* Both buttons only ask n8n to act. Nothing is written or deleted from here:
 * this page carries the publishable key, which is public by design, and a
 * page that could delete rows on its own would let anyone who opens the URL
 * do the same. WF-5 and WF-6 hold the credentials and do the work. */

/* An https page cannot call http://localhost, so the published site needs the
 * tunnel. Opened locally it should not need one, hence the second URL. */
function hookUrl(name){
  var c = window.OFFICE_HUB_CONFIG || {};
  var local = location.hostname === "localhost" || location.hostname === "127.0.0.1";
  return (local && c["N8N_" + name + "_WEBHOOK_URL_LOCAL"]) || c["N8N_" + name + "_WEBHOOK_URL"] || "";
}
function resetUrl(){ return hookUrl("RESET"); }
function scanUrl(){  return hookUrl("SCAN"); }
function rulesUrl(){  return hookUrl("RULES"); }
function peopleUrl(){ return hookUrl("PEOPLE"); }
function deptsUrl(){  return hookUrl("DEPTS"); }

function postHook(url, payload){
  return fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json", "ngrok-skip-browser-warning": "1" },
    body: JSON.stringify(payload || {})
  }).then(function(r){
    return r.json().catch(function(){ return null; }).then(function(d){
      if (!r.ok || !d || d.success !== true)
        throw new Error((d && (d.message || d.error)) || ("HTTP " + r.status));
      return d;
    });
  });
}

function doReset(){
  var url = resetUrl();
  if (!url || !confirm(t("resetAsk"))) return;

  var btn = document.getElementById("resetBtn");
  btn.disabled = true;
  btn.textContent = t("resetBusy");

  postHook(url).then(function(){
    btn.textContent = t("resetOk");
    /* Reload rather than clear the arrays: the page then shows exactly what
     * the database holds, with no chance of the two drifting apart. */
    location.reload();
  }).catch(function(e){
    alert(t("resetFail") + (e && e.message ? e.message : String(e)));
    btn.disabled = false;
    btn.textContent = t("resetBtn");
  });
}

/* WF-1 reacts to files that arrive after it starts polling. Anything already
 * sitting in Office Inbox, or dropped while n8n was stopped, is invisible to
 * it forever. This is the sweep that catches those. */
function doScan(){
  var url = scanUrl();
  if (!url) return;

  var btn = document.getElementById("scanBtn");
  btn.disabled = true;
  btn.textContent = t("scanBusy");

  /* WF-6 answers as soon as it has counted the folder, before it processes
   * anything — a browser should not sit on an open request while a language
   * model reads six documents. The count is what tells us when to stop
   * waiting. */
  postHook(url).then(function(d){
    var found = Number(d.found) || 0;
    if (!found){
      alert(t("scanNone"));
      btn.disabled = false;
      btn.textContent = t("scanBtn");
      return;
    }
    btn.textContent = t("scanRun", { n: found });
    awaitDocuments(countDocuments() + found);
  }).catch(function(e){
    alert(t("scanFail") + (e && e.message ? e.message : String(e)));
    btn.disabled = false;
    btn.textContent = t("scanBtn");
  });
}

function countDocuments(){ return db.kind === "live" ? live.documents.length : 0; }

/* ------------------------------------------------------ editing rules ---- */
/* Same shape as Reset and Scan: the page describes what it wants, WF-7 decides
 * whether to do it. Every check that matters - rank uniqueness, the enums, an
 * assignee that exists, and refusing to delete the last catch-all - is repeated
 * server-side, because the checks below only stop honest mistakes. A form is
 * not a security boundary; the webhook is. */

function ruleEditable(){ return db.kind === "live" && !!rulesUrl(); }

/* Which documents this rule would actually win, not merely match. A rule can
 * match a hundred documents and win none of them because a lower rank got
 * there first, and that is exactly the mistake worth catching before saving. */
function rulePreview(draft){
  var others = db.routingRules().filter(function(x){ return x.id !== draft.id; });
  var all = others.concat([draft]).sort(function(a, b){ return a.rank - b.rank; });
  var docs = db.documents(), win = 0;
  for (var i = 0; i < docs.length; i++){
    var d = docs[i];
    if (matchRule(all, { channel:d.channel, document_type:d.document_type,
        department:d.department, urgency:d.urgency, amount:d.amount }) === draft) win++;
  }
  return { win: win, total: docs.length };
}

function personEditable(){ return db.kind === "live" && !!peopleUrl(); }

/* What changes when this person steps aside. A backup that is itself away is
 * the case worth seeing before saving, and the one nobody thinks to check. */
function personPreview(draft){
  var rules = db.routingRules().filter(function(r){
    return r.is_active !== false && r.assign_to === draft.id;
  });
  var stepping = draft.is_active === false || (draft.away_until && draft.away_until >= today());
  var b = draft.backup_person ? byId(db.people(), draft.backup_person) : null;
  var bAway = !!(b && (b.is_active === false || (b.away_until && b.away_until >= today())));
  return { rules: rules.length, ranks: rules.map(function(r){ return r.rank; }),
           stepping: stepping, backup: b, backupAway: bAway };
}

/* One shape for both editors: post, re-read the table, redraw. Re-reading
 * rather than patching the local array means the screen shows what the database
 * holds, including anything the workflow normalised on the way through. */
function sendVia(url, table, query, target, failKey, payload, onDone){
  postHook(url, payload).then(function(){
    return fetchTable(table, query).then(function(rows){
      live[target] = rows;
      closeSheet();
      render();
    });
  }).catch(function(e){
    alert(t(failKey) + (e && e.message ? e.message : String(e)));
    if (onDone) onDone();
  });
}

function sendRule(payload, onDone){
  sendVia(rulesUrl(), "routing_rules", "select=*&order=rank.asc", "routing_rules",
          "ruleFail", payload, onDone);
}
function sendPerson(payload, onDone){
  sendVia(peopleUrl(), "people", "select=*", "people", "personFail", payload, onDone);
}
function sendDept(payload, onDone){
  sendVia(deptsUrl(), "departments", "select=*&order=sort.asc", "departments",
          "deptFail", payload, onDone);
}
function deptEditable(){ return db.kind === "live" && !!deptsUrl() && departments().length > 0; }

/* What closing this department would strand. An active rule matching a
 * department the model can no longer return does not error - it simply never
 * fires again, which is the whole reason WF-9 refuses it. */
function deptPreview(code){
  var docs  = db.documents().filter(function(d){ return d.department === code; }).length;
  var ppl   = db.people().filter(function(p){ return p.department === code; }).length;
  var rules = db.routingRules().filter(function(r){
    return r.is_active !== false && r.match_department === code; });
  return { docs: docs, people: ppl, ranks: rules.map(function(r){ return r.rank; }) };
}

/* Poll until the expected rows land, then reload. A document can also fail
 * inside WF-4 — an unreadable scan, a duplicate source_ref — so the target is
 * never guaranteed to arrive. The timeout reloads anyway and lets the page
 * show whatever did make it, which is more honest than spinning forever. */
function awaitDocuments(target){
  var tries = 0, MAX = 45;          /* 45 x 4s = three minutes */
  (function poll(){
    setTimeout(function(){
      fetchTable("documents", "select=id").then(function(rows){
        if (rows.length >= target || ++tries >= MAX) location.reload();
        else poll();
      }).catch(function(){
        if (++tries >= MAX) location.reload(); else poll();
      });
    }, 4000);
  })();
}

function liveConfigured(){
  var c = window.OFFICE_HUB_CONFIG || {};
  return !!(c.SUPABASE_URL && c.SUPABASE_PUBLISHABLE_KEY);
}

function fetchTable(name, query){
  var c = window.OFFICE_HUB_CONFIG;
  var url = c.SUPABASE_URL + "/rest/v1/" + name + "?" + (query || "select=*");
  return fetch(url, { headers: {
    apikey: c.SUPABASE_PUBLISHABLE_KEY,
    Authorization: "Bearer " + c.SUPABASE_PUBLISHABLE_KEY
  }}).then(function(r){
    if (!r.ok) throw new Error(name + ": HTTP " + r.status);
    return r.json();
  });
}

/* Switches to live data, or leaves the demo dataset in place and says why.
 *
 * The test is people, not documents. Zero documents used to mean "stay on the
 * demo set", which was right while there was no way to empty the database on
 * purpose. Now that Reset exists it would be wrong: you would clear everything
 * and the page would answer with eight invented rows, which reads as a reset
 * that failed. Zero people, on the other hand, means the schema was never
 * seeded and this is not the real database. */
function loadLive(){
  if (!liveConfigured()) return Promise.resolve(false);

  return Promise.all([
    fetchTable("people"),
    fetchTable("routing_rules", "select=*&order=rank.asc"),
    fetchTable("documents", "select=*&order=received_at.desc"),
    fetchTable("tasks"),
    fetchTable("notifications"),
    /* Added after the other five, and on a project that has not run the
     * migration yet it does not exist. An empty list is the correct answer
     * there - deptName falls back to the dictionary and every screen still
     * reads the way it did before. */
    fetchTable("departments", "select=*&order=sort.asc").catch(function(){ return []; })
  ]).then(function(r){
    if (!r[0].length) return false;

    live.people = r[0]; live.routing_rules = r[1];
    live.documents = r[2]; live.tasks = r[3]; live.notifications = r[4];
    live.departments = r[5];

    /* n8n writes tasks.document_id but never documents.task_id, so the link
     * exists in one direction only. The document sheet reads the other, so
     * fill it in here rather than add a node to the workflow for it. */
    live.documents.forEach(function(d){
      if (d.task_id) return;
      for (var i=0;i<live.tasks.length;i++)
        if (live.tasks[i].document_id === d.id) { d.task_id = live.tasks[i].id; return; }
    });

    db = supabaseDb;
    return true;
  }).catch(function(e){
    if (window.console) console.warn("Live data unavailable, showing the demo set:", e.message);
    return false;
  });
}

/* ==================================================== business logic ==== */
/* These functions are the specification for what n8n must do. They live here
 * so the behaviour can be seen and tested on screen before a node is wired. */

function matchRule(rules, f){
  for (var i=0;i<rules.length;i++){
    var r = rules[i];
    if (!r.is_active) continue;
    if (r.match_channel    != null && r.match_channel    !== f.channel)       continue;
    if (r.match_doc_type   != null && r.match_doc_type   !== f.document_type) continue;
    if (r.match_department != null && r.match_department !== f.department)    continue;
    if (r.match_urgency    != null && r.match_urgency    !== f.urgency)       continue;
    if (r.min_amount       != null && !(f.amount != null && f.amount >= r.min_amount)) continue;
    return r;
  }
  return null;
}

/* Same evaluation as matchRule, but it records why each earlier rule lost. */
function routeTrace(rules, f){
  var out = [];
  for (var i=0;i<rules.length;i++){
    var r = rules[i], why = null;
    if (!r.is_active) why = "inactive";
    else if (r.match_channel    != null && r.match_channel    !== f.channel)       why = t("channelIs", {c:t(f.channel)});
    else if (r.match_doc_type   != null && r.match_doc_type   !== f.document_type) why = t("typeIs",    {t:t(f.document_type)});
    else if (r.match_department != null && r.match_department !== f.department)    why = t("deptIs",    {d:deptName(f.department)});
    else if (r.match_urgency    != null && r.match_urgency    !== f.urgency)       why = t("urgIs",     {u:t(f.urgency)});
    else if (r.min_amount       != null && !(f.amount != null && f.amount >= r.min_amount))
      why = (f.amount == null) ? t("noAmount") : t("amountIs", {a:money(f.amount)});
    out.push({ rule:r, matched:!why, why:why });
    if (!why) break;
  }
  return out;
}

/* A person who is away hands the item to their backup.
 *
 * Inactive counts as away, permanently. Until people could be edited, is_active
 * was decorative - nothing read it, so switching someone off left them still
 * receiving work. Treating it as leave with no end date is what makes "remove
 * this person" a safe operation: the row stays, the history it is referenced by
 * stays, and the work moves. */
function resolvePerson(personId, todayStr){
  var p = byId(db.people(), personId);
  if (!p) return null;
  if (p.is_active === false || (p.away_until && p.away_until >= todayStr)){
    var b = byId(db.people(), p.backup_person);
    if (b) return { person:b, viaBackup:p };
  }
  return { person:p, viaBackup:null };
}

/* The four review rules. Any one of them alone is enough.
 *
 * Exactly three fields are counted, and they are exactly the three WF-4's
 * `Derive status` node counts. An earlier version also counted an empty
 * summary, which made this screen able to report "4 of 3 missing" for a
 * document the workflow had scored 3 - the simulator disagreeing with the
 * router it exists to predict. The workflow is the record; this follows it. */
function checkDetail(d){
  var missing = 0;
  if (d.sender_or_company === "Not found")       missing++;
  if (d.requested_action  === "No action found") missing++;
  if (d.deadline_text     === "Not found")       missing++;
  return [
    { label:t("rule1"), hit:d.confidence === "Low",      got:t("confIs", {c:t(d.confidence)}) },
    { label:t("rule2"), hit:missing >= 3,                got:t("fieldsMissing", {n:missing}) },
    { label:t("rule3"), hit:d.document_type === "other", got:t("typeIs", {t:t(d.document_type)}) },
    { label:t("rule4"), hit:d.urgency === "High" && d.deadline_text === "Not found",
      got:t(d.urgency) + " / " + ltr(sent(d.deadline_text)) }
  ];
}
function deriveStatus(d){
  var c = checkDetail(d);
  for (var i=0;i<c.length;i++) if (c[i].hit) return "needs_review";
  return "processed";
}

function emailFor(d){
  var r = resolvePerson(d.assigned_to, today());
  var isUrgent = d.urgency === "High";
  var subject = isUrgent
    ? t("subjUrgent", { t:t(d.document_type), s:ltr(val(d.sender_or_company)) })
    : t("subjNormal", { f:ltr(d.file_name) });
  var body =
      (isUrgent ? t("mUrgentOpen") : t("mNormalOpen")) + "\n\n"
    + t("mFile")     + ": " + ltr(d.file_name) + "\n"
    + t("mSender")   + ": " + ltr(sent(d.sender_or_company)) + "\n"
    + t("mType")     + ": " + t(d.document_type) + "\n"
    + t("mDept")     + ": " + deptName(d.department) + "\n"
    + t("mUrgency")  + ": " + t(d.urgency) + "\n"
    + t("mDeadline") + ": " + sent(d.deadline_text) + "\n"
    + (d.amount != null ? t("mAmount") + ": " + money(d.amount) + "\n" : "")
    + "\n" + t("mSummary") + "\n" + val(d.summary) + "\n"
    + "\n" + t("mAction")  + "\n" + sent(d.requested_action) + "\n"
    + (d.file_link ? "\n" + t("mLink") + "\n" + d.file_link + "\n" : "")
    + (d.status === "needs_review"
        ? "\n" + t("mReview") + "\n" + val(d.review_reason) + "\n" + t("mReviewNote") + "\n"
        : (d.requested_action === "No action found" ? "\n" + t("mNoAction") + "\n" : ""));
  return { kind:isUrgent ? "urgent" : "normal", to:r ? r.person.email : "",
           subject:subject, body:body, person:r ? r.person : null };
}

/* ============================================================ helpers === */

function byId(arr, id){ for (var i=0;i<arr.length;i++) if (arr[i].id === id) return arr[i]; return null; }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function today(){ return new Date().toISOString().slice(0,10); }
function fmtDate(s){ return s ? s.slice(0,10) : ""; }
function fmtWhen(s){ return s ? s.slice(0,10) + " " + s.slice(11,16) : ""; }
function money(n){ return n == null ? "" :
  Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2}); }
function personName(id){ var p = byId(db.people(), id); return p ? ltr(val(p.full_name)) : "—"; }

/* A latin string dropped into a Hebrew sentence gets reordered by the bidi
 * algorithm: "1-invoice.txt" renders as "invoice.txt-1". Wrapping it in an
 * isolate pins its internal direction without affecting the sentence. These
 * are plain characters, so this also works inside <option>, where markup
 * and dir attributes are unreliable. */
function ltr(s){ return isRTL() ? "⁦" + String(s == null ? "" : s) + "⁩" : s; }

/* Escape a value that came out of the database rather than the dictionary, and
 * isolate it when it is in the other language.
 *
 * A whole English sentence dropped bare into an RTL paragraph loses its
 * trailing punctuation to the far end: "Total due is 15,576.00 ILS." renders
 * with the full stop on the left, and a summary that ends mid-air reads like a
 * truncation bug. Testing for Hebrew letters rather than for LANG is what lets
 * a Hebrew summary and an English one sit in the same table and both be right. */
function txt(v){
  var s = String(val(v));
  return esc(/[֐-׿]/.test(s) ? s : ltr(s));
}

function opts(list, sel, anyKey){
  var h = '<option value="">' + esc(t(anyKey)) + '</option>';
  for (var i=0;i<list.length;i++){
    h += '<option value="' + esc(list[i]) + '"' + (list[i] === sel ? ' selected' : '') + '>'
       + esc(t(list[i])) + '</option>';
  }
  return h;
}
function urgPill(u){
  return '<span class="pill ' + (u === "High" ? "p-hi" : u === "Medium" ? "p-me" : "p-lo") + '">'
       + esc(t(u) || "—") + '</span>';
}
function statusPill(s){
  return '<span class="pill ' + (s === "needs_review" ? "p-rev" : "p-ok") + '">' + esc(t(s)) + '</span>';
}
function priPill(p){
  return '<span class="pill ' + (p === "urgent" ? "p-hi" : p === "high" ? "p-me" : "p-lo") + '">'
       + esc(t(p)) + '</span>';
}
function taskPill(s){
  return '<span class="pill p-' + (s === "working" ? "work" : s === "done" ? "done" : s === "stuck" ? "stuck" : "todo")
       + '">' + esc(t(s)) + '</span>';
}
/* Sentinel values render greyed and italic so a missing field looks missing. */
function nf(v){
  var isSent = (v === "Not found" || v === "No action found" || v == null || v === "");
  if (isSent) return '<span class="notfound">' + esc(sent(v) || "—") + '</span>';
  return txt(v);
}

/* =============================================================== boot === */

var state = {
  screen: "flow", filters: {},
  sim: { channel:"drive", document_type:"invoice", department:"Finance", urgency:"Medium", amount:"" },
  flowDoc: "d1", mailDoc: "d1", ruleId: null, personId: null, deptCode: null
};

function go(id){ state.screen = id; state.filters = {}; closeSheet(); render(); window.scrollTo(0,0); }
function setF(k, v){ state.filters[k] = v; render(); }
function setSim(k, v){ state.sim[k] = v; render(); }
function setFlowDoc(id){ state.flowDoc = id; render(); }
function setMailDoc(id){ state.mailDoc = id; render(); }

function renderTabs(){
  var h = "";
  for (var i=0;i<SCREENS.length;i++){
    var s = SCREENS[i];
    h += '<button onclick="go(\'' + s.id + '\')" class="' + (state.screen === s.id ? "on" : "") + '">'
       + esc(t(s.key)) + (s.count ? '<b>' + s.count() + '</b>' : '') + '</button>';
  }
  document.getElementById("tabs").innerHTML = h;
}

function render(){
  renderTabs();
  for (var i=0;i<SCREENS.length;i++){
    if (SCREENS[i].id === state.screen){
      document.getElementById("view").innerHTML = SCREENS[i].render();
      return;
    }
  }
}

function closeSheet(){
  document.getElementById("sheet").classList.remove("on");
  document.getElementById("scrim").classList.remove("on");
}

function boot(){
  document.getElementById("langSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-lang]"); if (b) setLang(b.dataset.lang);
  });
  document.getElementById("themeSeg").addEventListener("click", function(e){
    var b = e.target.closest("button[data-theme]"); if (!b) return;
    var cur = document.documentElement.getAttribute("data-theme");
    setTheme(cur === b.dataset.theme ? null : b.dataset.theme);
  });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeSheet(); });

  setTheme(store.get("oh.theme", "") || null);
  setLang(store.get("oh.lang", "en"));

  /* Draw with the demo set first. The page is usable before the network
   * answers, and stays usable if it never does. */
  var rb = document.getElementById("resetBtn");
  rb.textContent = t("resetBtn");
  rb.addEventListener("click", doReset);

  var sb = document.getElementById("scanBtn");
  sb.textContent = t("scanBtn");
  sb.addEventListener("click", doScan);

  loadLive().then(function(switched){
    if (!switched) return;
    document.getElementById("srcPill").textContent = t("srcLive");
    /* Only offered against the real database. On the demo set there is
     * nothing to reset and nothing a scan could add, so both buttons
     * would just mislead. */
    if (resetUrl()) rb.hidden = false;
    if (scanUrl())  sb.hidden = false;
    render();
  });
}
</script>
<script>
/* ---- screens.js ---- */
/* Office Hub - screen renderers. Core logic and i18n live in core.js. */

"use strict";

var SCREENS = [
  { id:"flow",   key:"navFlow",   render:function(){ return renderFlow(); },   count:null },
  { id:"inbox",  key:"navInbox",  render:function(){ return renderInbox(); },
    count:function(){ return db.documents().length; } },
  { id:"review", key:"navReview", render:function(){ return renderReview(); },
    count:function(){ return db.documents().filter(function(d){ return d.status === "needs_review"; }).length; } },
  { id:"tasks",  key:"navTasks",  render:function(){ return renderTasks(); },
    count:function(){ return db.tasks().filter(function(t){ return t.status !== "done"; }).length; } },
  { id:"emails", key:"navEmails", render:function(){ return renderEmails(); },
    count:function(){ return db.notifications().length; } },
  { id:"people", key:"navPeople", render:function(){ return renderPeople(); },
    count:function(){ return db.people().length; } },
  { id:"rules",  key:"navRules",  render:function(){ return renderRules(); },
    count:function(){ return db.routingRules().length; } },
  { id:"dash",   key:"navDash",   render:function(){ return renderDash(); },   count:null }
];

function head(titleKey, subKey, extra){
  return '<div class="head"><h2>' + esc(t(titleKey)) + '</h2>'
       + (extra || "") + '</div><p class="sub">' + esc(t(subKey)) + '</p>';
}
function panel(inner){ return '<div class="panelwrap"><div class="tblwrap">' + inner + '</div></div>'; }

/* Reachable now that a live database may legitimately hold no documents —
 * right after a reset, which is the state the demo starts from. The screens
 * that pick a single document to walk through have nothing to pick. */
function emptyState(){
  return '<div class="card pad"><b>' + esc(t("emptyTitle")) + '</b>'
       + '<div class="dim" style="margin-top:6px">' + esc(t("emptyBody")) + '</div></div>';
}
/* Every department dropdown offers the open ones by code, labelled by name.
 * A value already stored in a since-closed department is added back so the
 * filter that is currently applied does not silently reset itself. */
function deptOpts(sel){
  var codes = deptCodes().slice();
  if (sel && codes.indexOf(sel) === -1) codes.push(sel);
  var h = '<option value="">' + esc(t("anyDept")) + '</option>';
  for (var i = 0; i < codes.length; i++)
    h += '<option value="' + esc(codes[i]) + '"' + (codes[i] === sel ? ' selected' : '') + '>'
       + esc(deptName(codes[i])) + '</option>';
  return h;
}
function docPicker(sel, handler){
  return '<select onchange="' + handler + '(this.value)">' + db.documents().map(function(d){
    return '<option value="' + d.id + '"' + (d.id === sel ? ' selected' : '') + '>'
         + esc(ltr(d.file_name)) + '</option>';
  }).join("") + '</select>';
}

/* ================================================================ flow == */

function stage(n, node, wf, active, inner){
  return '<div class="stage' + (active ? " act" : " skip") + '">'
    + '<div class="stagehd"><span class="stepn">' + n + '</span><b>' + esc(node) + '</b>'
    + '<span class="wf">' + esc(wf) + '</span></div>' + inner + '</div>';
}
function conn(){ return '<div class="conn"></div>'; }

function renderFlow(){
  var d = byId(db.documents(), state.flowDoc) || db.documents()[0];
  if (!d) return head("flowH", "flowSub") + emptyState();
  var rules = db.routingRules();
  var trace = routeTrace(rules, { channel:d.channel, document_type:d.document_type,
    department:d.department, urgency:d.urgency, amount:d.amount });
  var winner = trace[trace.length - 1];
  var res = winner.matched ? resolvePerson(winner.rule.assign_to, today()) : null;
  var task = d.task_id ? byId(db.tasks(), d.task_id) : null;
  var mail = emailFor(d);
  var isDrive = d.channel === "drive";

  var h = head("flowH", "flowSub")
    + '<div class="toolbar" style="border-radius:12px;border:1px solid var(--rule);margin-bottom:16px">'
    + docPicker(d.id, "setFlowDoc")
    + '<span class="pill">' + esc(t(d.channel)) + '</span>' + statusPill(d.status) + '</div>';

  /* A Drive file carries no record of which of the two intakes read it - both
   * use the Drive id as source_ref, which is the point. Naming both is honest;
   * naming one would be a guess. */
  h += stage(1, t("st1" + d.channel), isDrive ? "WF-1 · WF-6" : d.channel === "form" ? "WF-2" : "WF-3", true,
      '<dl class="kv"><dt>' + esc(t("whatFired")) + '</dt><dd>' + esc(t("fired" + d.channel.charAt(0).toUpperCase() + d.channel.slice(1))) + '</dd>'
    + '<dt>' + esc(t("sourceRef")) + '</dt><dd class="mono dim">' + esc(ltr(d.source_ref)) + '</dd>'
    + '<dt>' + esc(t("received")) + '</dt><dd class="num">' + fmtWhen(d.received_at) + '</dd></dl>');

  h += conn() + stage(2, isDrive ? t("st2drive") : t("st2other"), "WF-1..3, WF-6", true,
      '<div class="dim">' + esc(isDrive ? t("st2driveB") : t("st2otherB")) + '</div>');

  h += conn() + stage(3, t("st3"), "WF-1..3, WF-6", true,
      /* dir="ltr" is load-bearing. This is a code listing, and in an RTL
       * paragraph the two latin runs on each line are placed right-to-left
       * relative to one another: "source_ref = 1vav6Bx" reads back as
       * "1vav6Bx = source_ref". Isolating the value made it worse, not better,
       * because an isolate is what turns the value into a reorderable unit. */
      '<div class="mono dim" dir="ltr" style="line-height:1.9;text-align:start">'
    + 'channel = ' + esc(d.channel) + '<br>'
    + 'source_ref = ' + esc(ltr(d.source_ref)) + '<br>'
    + 'file_name = ' + esc(ltr(d.file_name)) + '<br>'
    + 'file_link = ' + (d.file_link ? esc(d.file_link) : '<span class="dim3">' + esc(t("emptyVal")) + '</span>') + '<br>'
    + 'text = <span class="dim3">' + esc(t("theBody")) + '</span></div>'
    + '<div class="dim3" style="font-size:12.5px;margin-top:9px">' + esc(t("st3note")) + '</div>');

  h += conn() + stage(4, t("st4"), "WF-4", true,
      '<dl class="kv">'
    + '<dt>document_type</dt><dd><span class="pill">' + esc(t(d.document_type)) + '</span></dd>'
    + '<dt>sender_or_company</dt><dd>' + nf(d.sender_or_company) + '</dd>'
    + '<dt>summary</dt><dd>' + txt(d.summary) + '</dd>'
    + '<dt>requested_action</dt><dd>' + nf(d.requested_action) + '</dd>'
    + '<dt>deadline</dt><dd>' + nf(d.deadline_text) + '</dd>'
    + '<dt>urgency</dt><dd>' + urgPill(d.urgency) + '</dd>'
    + '<dt>department</dt><dd>' + txt(deptName(d.department)) + '</dd>'
    + '<dt>amount</dt><dd>' + (d.amount != null ? '<span class="num">' + money(d.amount) + '</span>' : nf(null)) + '</dd>'
    + '<dt>confidence</dt><dd>' + esc(t(d.confidence)) + '</dd></dl>');

  h += conn() + stage(5, t("st5"), "WF-4", true,
      checkDetail(d).map(function(c){
        return '<div class="rulerow' + (c.hit ? " trip" : "") + '">'
          + '<span class="mk">' + (c.hit ? esc(t("tripped")) : "—") + '</span>'
          + '<span>' + esc(c.label) + '</span>'
          + '<span class="why">' + esc(c.got) + '</span></div>';
      }).join("")
    + '<div style="margin-top:11px">' + statusPill(d.status) + '</div>');

  h += conn() + stage(6, t("st6"), "WF-4", true, '<div class="dim">' + esc(t("st6b")) + '</div>');

  h += conn() + stage(7, t("st7"), "WF-4", true,
      trace.map(function(x){
        return '<div class="rulerow' + (x.matched ? " win" : "") + '">'
          + '<span class="mk num">' + x.rule.rank + '</span>'
          + '<span>' + txt(dbt(x.rule.label)) + '</span>'
          + '<span class="why">' + esc(x.matched ? t("match") : x.why) + '</span></div>';
      }).join("")
    + (res
        ? '<div style="margin-top:12px">' + esc(t("goesTo")) + ' <b>' + txt(res.person.full_name) + '</b> '
          + '<span class="dim3">' + txt(dbt(res.person.role_title)) + '</span>'
          + (res.viaBackup ? '<div class="dim" style="font-size:12.5px;margin-top:3px">'
              + esc(t("awayNote", { a:ltr(val(res.viaBackup.full_name)), b:ltr(res.viaBackup.away_until) })) + '</div>' : '')
          + '</div>'
        : '<div class="banner" style="margin-top:11px">' + esc(t("noRule")) + '</div>'));

  h += conn() + stage(8, t("st8"), "WF-4", !!task,
      task

function personDraft(id){
  var v = function(x){ var e = document.getElementById("pf_" + x); return e ? e.value : ""; };
  return {
    id: id || null,
    full_name: v("full_name").trim(),
    slug: v("slug").trim().toLowerCase(),
    email: v("email").trim(),
    role_title: v("role_title").trim(),
    department: v("department"),
    away_until: v("away_until") || null,
    backup_person: v("backup_person") || null,
    is_active: document.getElementById("pf_is_active").checked
  };
}

function personLive(){
  var el = document.getElementById("pf_preview");
  if (!el) return;
  var p = personPreview(personDraft(state.personId));
  var lines = [ p.rules ? t("pvRules", { n:p.rules, r:p.ranks.join(", ") }) : t("pvNoRules") ];
  if (p.rules){
    if (!p.backup)        lines.push(t("pvNoBackup"));
    else if (p.backupAway) lines.push(t("pvBackupAway", { b: val(p.backup.full_name) }));
    else                   lines.push(t("pvGoesTo",     { b: val(p.backup.full_name) }));
  }
  el.textContent = lines.join(" ");
}

function submitPerson(id){
  var btn = document.getElementById("pf_save");
  btn.disabled = true;
  btn.textContent = t("personSaving");
  sendPerson({ action: id ? "update" : "create", id: id || undefined, person: personDraft(id) },
    function(){ btn.disabled = false; btn.textContent = t("personSave"); });
}

function removePerson(id){
  var p = byId(db.people(), id);
  if (!p || !confirm(t("personDelAsk", { a: val(p.full_name) }))) return;
  sendPerson({ action: "delete", id: id });
}

/* =============================================================== rules == */

function renderRules(){
  var rules = db.routingRules();
  var anyC = '<span class="dim3">' + esc(t("any")) + '</span>';

  var edit = ruleEditable();

  var rows = rules.map(function(r){
    return '<tr' + (edit ? ' class="click" onclick="openRuleEditor(\'' + r.id + '\')"' : '')
      +   (r.is_active === false ? ' style="opacity:.5"' : '') + '>'
      + '<td class="num nowrap">' + r.rank + '</td>'
      + '<td>' + txt(dbt(r.label)) + '</td>'
      + '<td class="nowrap">' + (r.match_channel ? esc(t(r.match_channel)) : anyC) + '</td>'
      + '<td class="nowrap">' + (r.match_doc_type ? '<span class="pill">' + esc(t(r.match_doc_type)) + '</span>' : anyC) + '</td>'
      + '<td class="nowrap">' + (r.match_department ? txt(deptName(r.match_department)) : anyC) + '</td>'
      + '<td class="nowrap">' + (r.match_urgency ? urgPill(r.match_urgency) : anyC) + '</td>'
      /* Bidi mirrors ≥ into ≤ in an RTL cell. That is correct typography and a
       * dangerous rule: "≥ 5,000" is the difference between the manager seeing
       * a large invoice and never seeing one. The isolate pins it LTR. */
      + '<td class="nowrap num">' + (r.min_amount != null
          ? esc(ltr("≥ " + money(r.min_amount))) : anyC) + '</td>'
      + '<td class="nowrap">' + esc(personName(r.assign_to)) + '</td></tr>';
  }).join("");

  var s = state.sim;
  var hit = matchRule(rules, { channel:s.channel, document_type:s.document_type,
    department:s.department, urgency:s.urgency, amount: s.amount === "" ? null : Number(s.amount) });

  var res;
  if (!hit){
    res = '<div class="banner">' + esc(t("noRuleWarn")) + '</div>';
  } else {
    var r = resolvePerson(hit.assign_to, today());
    res = '<dl class="kv">'
      + '<dt>' + esc(t("ruleLbl")) + '</dt><dd><span class="num">' + hit.rank + '</span> &nbsp;' + txt(dbt(hit.label)) + '</dd>'
      + '<dt>' + esc(t("goesTo")) + '</dt><dd><b>' + txt(r.person.full_name) + '</b> '
      +   '<span class="dim3">' + txt(dbt(r.person.role_title)) + '</span></dd>'
      + (r.viaBackup ? '<dt>' + esc(t("why")) + '</dt><dd class="dim">'
          + esc(t("awayNote", { a:ltr(val(r.viaBackup.full_name)), b:ltr(r.viaBackup.away_until) })) + '</dd>' : '')
      + '</dl>';
  }

  return head("navRules", "rulesSub",
      edit ? '<button class="btn btn-primary btn-sm" style="margin-inline-start:auto" onclick="openRuleEditor()">'
             + esc(t("ruleAdd")) + '</button>' : "")
    + (edit ? '<p class="sub" style="margin-top:-10px">' + esc(t("ruleEditHint")) + '</p>' : "")
    + panel('<table class="t"><thead><tr>'
        + ['cRank','cRule','cChannel','cType','cDept','cUrgency','cAmount','cAssign']
            .map(function(k){ return '<th>' + esc(t(k)) + '</th>'; }).join("")
        + '</tr></thead><tbody>' + rows + '</tbody></table>')
    + '<div class="head" style="margin-top:26px"><h2>' + esc(t("simulator")) + '</h2></div>'
    + '<p class="sub">' + esc(t("simSub")) + '</p>'
    + '<div class="panelwrap"><div class="toolbar">'
    +   '<select onchange="setSim(\'channel\',this.value)">'       + opts(D.CHANNELS,    s.channel,       "anyChannel") + '</select>'
    +   '<select onchange="setSim(\'document_type\',this.value)">' + opts(D.DOC_TYPES,   s.document_type, "anyType")    + '</select>'
    +   '<select onchange="setSim(\'department\',this.value)">'    + deptOpts(s.department) + '</select>'
    +   '<select onchange="setSim(\'urgency\',this.value)">'       + opts(D.URGENCIES,   s.urgency,       "anyUrgency") + '</select>'
    +   '<input type="number" placeholder="' + esc(t("amountPh")) + '" value="' + esc(s.amount)
    +     '" style="width:120px" oninput="setSim(\'amount\',this.value)">'
    + '</div><div style="padding:16px 18px">' + res + '</div></div>';
}

/* ======================================================== rules editor == */
/* Rendered into the same side sheet the document detail uses, so the scrim,
 * the Escape key and the close button already work.
 *
 * The form is read at submit time rather than re-rendered on every keystroke:
 * re-rendering would rebuild the inputs and throw away the caret. Only the
 * preview line updates live, and it updates one span. */

function ruleField(label, inner, hint){
  return '<div style="margin-bottom:14px">'
    + '<div class="lbl" style="margin-bottom:5px">' + esc(t(label)) + '</div>' + inner
    + (hint ? '<div class="dim3" style="font-size:12px;margin-top:5px">' + esc(t(hint)) + '</div>' : '')
    + '</div>';
}

function openRuleEditor(id){
  var r = id ? byId(db.routingRules(), id) : null;
  var W = 'style="width:100%"';

  /* A new rule is offered the next free hundred rather than a duplicate of an
   * existing rank, because a clash is the one error the form cannot fix for
   * you - it has to choose someone's rank to change. */
  var used = db.routingRules().map(function(x){ return x.rank; });
  var nextRank = r ? r.rank : Math.min(999, (used.length ? Math.max.apply(null, used) : 0) + 1);

  var sel = function(name, list, cur, anyKey){
    return '<select id="rf_' + name + '" ' + W + ' oninput="ruleLive()">'
      + opts(list, cur == null ? "" : cur, anyKey) + '</select>';
  };

  var h = '<div class="shead"><h3>' + esc(t(r ? "ruleEdit" : "ruleNew")) + '</h3>'
    + '<button class="xbtn" onclick="closeSheet()" aria-label="Close">&times;</button></div>'
    + '<div class="ssec">'
    + ruleField("fLabel", '<input type="text" id="rf_label" maxlength="80" ' + W
        + ' value="' + esc(r ? val(r.label) : "") + '">', "ruleLabelHint")
    + ruleField("fRank", '<input type="number" id="rf_rank" min="1" max="999" step="1" ' + W
        + ' value="' + nextRank + '" oninput="ruleLive()">', "ruleRankHint")
    + ruleField("fAssign", '<select id="rf_assign" ' + W + '>'
        + db.people().map(function(p){
            return '<option value="' + p.id + '"' + (r && r.assign_to === p.id ? ' selected' : '') + '>'
                 + esc(val(p.full_name)) + ' · ' + esc(dbt(p.role_title)) + '</option>';
          }).join("") + '</select>')
    + '</div><div class="ssec">'
    + '<h4>' + esc(t("ruleConds")) + '</h4>'
    + ruleField("cChannel",  sel("channel",  D.CHANNELS,    r && r.match_channel,    "anyChannel"))
    + ruleField("cType",     sel("type",     D.DOC_TYPES,   r && r.match_doc_type,   "anyType"))
    + ruleField("cDept",     '<select id="rf_dept" style="width:100%" oninput="ruleLive()">'
        + deptOpts(r && r.match_department) + '</select>')
    + ruleField("cUrgency",  sel("urgency",  D.URGENCIES,   r && r.match_urgency,    "anyUrgency"))
    + ruleField("cAmount",   '<input type="number" id="rf_amount" min="0" step="0.01" ' + W
        + ' placeholder="' + esc(t("any")) + '" value="'
        + (r && r.min_amount != null ? esc(r.min_amount) : "") + '" oninput="ruleLive()">')
    + '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px">'
    +   '<input type="checkbox" id="rf_active"' + (!r || r.is_active !== false ? ' checked' : '') + '>'
    +   esc(t("fActive")) + '</label>'
    + '<div class="dim3" style="font-size:12px;margin-top:12px">' + esc(t("ruleCondHint")) + '</div>'
    + '</div><div class="ssec">'
    + '<div class="banner" id="rf_preview"></div>'
    + '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">'
    +   '<button class="btn btn-primary btn-sm" id="rf_save" onclick="submitRule(' + (r ? "'" + r.id + "'" : "null") + ')">'
    +     esc(t("ruleSave")) + '</button>'
    +   '<button class="btn btn-sm" onclick="closeSheet()">' + esc(t("ruleCancel")) + '</button>'
    +   (r ? '<button class="btn btn-sm" style="margin-inline-start:auto;color:var(--stuck-bg)" '
            + 'onclick="removeRule(\'' + r.id + '\')">' + esc(t("ruleDelete")) + '</button>' : "")
    + '</div></div>';

  state.ruleId = r ? r.id : null;
  document.getElementById("sheet").innerHTML = h;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
  ruleLive();
}

/* Reads the form as it stands. Kept separate so the preview and the submit
 * path can never disagree about what the form says. */
function ruleDraft(id){
  var v = function(x){ var e = document.getElementById("rf_" + x); return e ? e.value : ""; };
  var amt = v("amount").trim();
  return {
    id: id || null,
    rank: Number(v("rank")),
    label: v("label").trim(),
    match_channel:    v("channel")  || null,
    match_doc_type:   v("type")     || null,
    match_department: v("dept")     || null,
    match_urgency:    v("urgency")  || null,
    min_amount: amt === "" ? null : Number(amt),
    assign_to: v("assign"),
    is_active: document.getElementById("rf_active").checked
  };
}

function ruleLive(){
  var el = document.getElementById("rf_preview");
  if (!el) return;
  /* state.ruleId, not null: while editing rule X the draft replaces X in the
   * ranking. Leaving X in would make the rule compete with itself and the
   * count would read 0 for every edit. */
  var p = rulePreview(ruleDraft(state.ruleId));
  el.textContent = p.win
    ? t("ruleHits", { n:p.win, m:p.total })
    : t("ruleHitsNone", { m:p.total });
}

function submitRule(id){
  var draft = ruleDraft(id);
  var btn = document.getElementById("rf_save");
  btn.disabled = true;
  btn.textContent = t("ruleSaving");
  sendRule({ action: id ? "update" : "create", id: id || undefined, rule: draft },
    function(){ btn.disabled = false; btn.textContent = t("ruleSave"); });
}

function removeRule(id){
  var r = byId(db.routingRules(), id);
  if (!r || !confirm(t("ruleDelAsk", { a: dbt(r.label) }))) return;
  sendRule({ action: "delete", id: id });
}

/* =========================================================== dashboard == */

function renderDash(){
  var docs = db.documents(), tasks = db.tasks(), people = db.people();
  var stats = [
    [docs.length, t("mDocs")],
    [docs.filter(function(d){ return d.urgency === "High"; }).length, t("mUrgentB")],
    [docs.filter(function(d){ return d.status === "needs_review"; }).length, t("mWaiting")],
    [tasks.filter(function(x){ return x.status !== "done"; }).length, t("mOpenTasks")]
  ].map(function(x){
    return '<div class="metric"><div class="v num">' + x[0] + '</div><div class="l">' + esc(x[1]) + '</div></div>';
  }).join("");

  function tally(key){
    var m = {}; docs.forEach(function(d){ m[d[key]] = (m[d[key]] || 0) + 1; });
    var label = key === "department" ? deptName : t;
    return Object.keys(m).sort().map(function(k){
      return '<tr><td>' + txt(label(k)) + '</td><td class="nowrap num">' + m[k] + '</td></tr>';
    }).join("");
  }

  var loadRows = people.map(function(p){
    var mine = tasks.filter(function(x){ return x.assigned_to === p.id && x.status !== "done"; });
    var urg = mine.filter(function(x){ return x.priority === "urgent"; }).length;
    return '<tr><td>' + txt(p.full_name) + '</td>'
      + '<td class="nowrap num">' + mine.length + '</td>'
      + '<td class="nowrap">' + (urg ? '<span class="pill p-hi">' + urg + '</span>'
          : '<span class="dim3 num">0</span>') + '</td></tr>';
  }).join("");

  return head("navDash", "dashSub")
    + '<div class="grid g3" style="margin-bottom:20px">' + stats + '</div>'
    + '<div class="grid g2">'
    +   '<div><div class="lbl" style="margin-bottom:8px">' + esc(t("byDept")) + '</div>'
    +     panel('<table class="t"><thead><tr><th>' + esc(t("cDept")) + '</th><th>' + esc(t("cDocs"))
    +       '</th></tr></thead><tbody>' + tally("department") + '</tbody></table>') + '</div>'
    +   '<div><div class="lbl" style="margin-bottom:8px">' + esc(t("byChannel")) + '</div>'
    +     panel('<table class="t"><thead><tr><th>' + esc(t("cChannel")) + '</th><th>' + esc(t("cDocs"))
    +       '</th></tr></thead><tbody>' + tally("channel") + '</tbody></table>') + '</div>'
    + '</div>'
    + '<div class="lbl" style="margin:24px 0 8px">' + esc(t("workload")) + '</div>'
    + panel('<table class="t"><thead><tr><th>' + esc(t("cPerson")) + '</th><th>' + esc(t("cOpen"))
        + '</th><th>' + esc(t("cUrgentN")) + '</th></tr></thead><tbody>' + loadRows + '</tbody></table>');
}

/* =============================================================== sheet == */

function openDoc(id){
  var d = byId(db.documents(), id);
  if (!d) return;
  var rule = d.matched_rule ? byId(db.routingRules(), d.matched_rule) : null;
  var task = d.task_id ? byId(db.tasks(), d.task_id) : null;
  var notes = db.notifications().filter(function(n){ return n.document_id === d.id; });

  var h = '<div class="shead"><h3>' + esc(ltr(d.file_name)) + '</h3>'
    + '<button class="xbtn" onclick="closeSheet()" aria-label="Close">&times;</button></div>';

  h += '<div class="ssec"><h4>' + esc(t("secIntake")) + '</h4><dl class="kv">'
    + '<dt>' + esc(t("cChannel"))   + '</dt><dd>' + esc(t(d.channel)) + '</dd>'
    + '<dt>' + esc(t("received"))   + '</dt><dd class="num">' + fmtWhen(d.received_at) + '</dd>'
    + '<dt>' + esc(t("sourceRef"))  + '</dt><dd class="mono dim">' + esc(ltr(d.source_ref)) + '</dd>'
    + (d.file_link ? '<dt>' + esc(t("cFile")) + '</dt><dd><a href="' + esc(d.file_link)
        + '" target="_blank" rel="noopener">' + esc(t("openDrive")) + '</a></dd>' : '')
    + '</dl></div>';

  h += '<div class="ssec"><h4>' + esc(t("secModel")) + '</h4><dl class="kv">'
    + '<dt>' + esc(t("fType"))     + '</dt><dd><span class="pill">' + esc(t(d.document_type)) + '</span></dd>'
    + '<dt>' + esc(t("fSender"))   + '</dt><dd>' + nf(d.sender_or_company) + '</dd>'
    + '<dt>' + esc(t("fSummary"))  + '</dt><dd>' + txt(d.summary) + '</dd>'
    + '<dt>' + esc(t("fAction"))   + '</dt><dd>' + nf(d.requested_action) + '</dd>'
    + '<dt>' + esc(t("fDeadline")) + '</dt><dd>' + nf(d.deadline_text)
    +   ' <span class="dim3">(' + esc(d.deadline_date ? t("normalised", {d:ltr(d.deadline_date)}) : t("notNormalisable")) + ')</span></dd>'
    + '<dt>' + esc(t("fUrgency"))  + '</dt><dd>' + urgPill(d.urgency) + '</dd>'
    + '<dt>' + esc(t("fDept"))     + '</dt><dd>' + txt(deptName(d.department)) + '</dd>'
    + '<dt>' + esc(t("fAmount"))   + '</dt><dd>' + (d.amount != null
        ? '<span class="num">' + money(d.amount) + '</span>' : nf(null)) + '</dd>'
    + '<dt>' + esc(t("fConfidence")) + '</dt><dd>' + esc(t(d.confidence)) + '</dd>'
    + '</dl></div>';

  h += '<div class="ssec"><h4>' + esc(t("secStatus")) + '</h4>' + statusPill(d.status)
    + (d.review_reason ? '<div class="banner" style="margin-top:11px">' + reviewReason(d.review_reason) + '</div>' : '')
    + '</div>';

  h += '<div class="ssec"><h4>' + esc(t("secRouting")) + '</h4><dl class="kv">'
    + '<dt>' + esc(t("matchedRule")) + '</dt><dd>' + (rule
        ? '<span class="num">' + rule.rank + '</span> ' + txt(dbt(rule.label))
        : '<span class="dim3">' + esc(t("none")) + '</span>') + '</dd>'
    + '<dt>' + esc(t("assignedTo")) + '</dt><dd>' + esc(personName(d.assigned_to)) + '</dd>'
    + '</dl></div>';

  h += '<div class="ssec"><h4>' + esc(t("secResult")) + '</h4><dl class="kv">'
    + '<dt>' + esc(t("taskW")) + '</dt><dd>' + (task
        ? txt(task.title) + ' ' + taskPill(task.status)
        : '<span class="dim3">' + esc(t("noneCreated")) + '</span>') + '</dd>'
    + '<dt>' + esc(t("notified")) + '</dt><dd>' + (notes.length
        ? notes.map(function(n){
            return '<div><span class="pill ' + (n.kind === "urgent" ? "p-hi" : "p-lo") + '">'
              + esc(t(n.kind)) + '</span> <span class="mono dim">' + esc(ltr(n.to_email)) + '</span></div>';
          }).join("")
        : '<span class="dim3">' + esc(t("nothingSent")) + '</span>') + '</dd>'
    + '</dl></div>';

  document.getElementById("sheet").innerHTML = h;
  document.getElementById("sheet").classList.add("on");
  document.getElementById("scrim").classList.add("on");
}
</script>
